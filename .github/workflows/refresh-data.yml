name: Refresh data (every 6h)

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC.
    # 4×/day strikes a balance:
    #   - Fast-moving feeds (HungerMap, GDACS, ReliefWeb, OpenAQ, NASA FIRMS,
    #     Open-Meteo) refresh meaningfully more often than daily.
    #   - Heavy bulk downloads (FAO FBS ZIP ~21MB, FAO TCL ZIP ~250MB,
    #     World Bank WFSO ~60 API pages) still only hit upstream 4×/day —
    #     polite to FAO's CDN, well under any documented rate limit.
    #   - Most upstream data is monthly/quarterly so the 4 extra daily runs
    #     mostly just re-fetch the same bytes; we keep them anyway so the
    #     "loaded_at" timestamp on the source-health UI stays fresh and any
    #     intra-day spot updates from FAO/WB land within hours.
    # Every-2h was considered but rejected: 12 bulk downloads/day × 250MB
    # of FAOSTAT TCL is wasteful when that file changes ~once a year.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI

env:
  # Opt into Node 24 early to silence Node 20 deprecation warnings.
  # GitHub will force this default starting June 2nd, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    # v39 — hard ceiling. A normal run is ~25-40 min; a hung feed (e.g. FEWS
    # read-timeout retry loops) once dragged a run to ~1h50m before failing.
    # Cap the whole job so a stuck feed can't burn Actions minutes — GitHub
    # kills it cleanly and the next 6-hourly run retries.
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run all refresh scripts
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          IPC_API_KEY: ${{ secrets.IPC_API_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
          # v22.19 — FDW issues short-lived JWTs from username/password; no
          # static "API token" exists. Set these if you have an FDW partner
          # account. Without them, refresh_fews.py tries unauthenticated
          # public access and writes a stub if no data is returned.
          FDW_USERNAME: ${{ secrets.FDW_USERNAME }}
          FDW_PASSWORD: ${{ secrets.FDW_PASSWORD }}
        run: |
          cd scripts
          python run_all.py

      # v20.33 — data integrity validation. Reads every expected output file
      # produced by run_all.py, validates JSON + envelope shape + non-trivial
      # data payload. Critical failures (>= 4) trip non-zero exit, so the
      # workflow status reflects reality instead of always being green.
      # See scripts/validate_data.py for per-file criticality + shape rules.
      - name: Validate data integrity
        run: |
          cd scripts
          python validate_data.py

      # v35 — FDRS regression gate: pinned formula fixtures (11 checks) must pass
      # before any data commit. This is the "no silent formula drift" release gate.
      - name: FDRS formula regression gate
        run: |
          cd scripts
          python test_fdrs_v2.py

      # v23/v35 — content-level QA gate (dup-ISO, coverage floors, freshness SLA,
      # provenance-ratio guard, US-state semantic test, crisis-feed honesty).
      # v35: now BLOCKING — hard FAILs stop the commit (freshness issues are WARNs
      # and never fail; the schema-shape scan was scoped to shipped files, so a
      # clean run is the expected state).
      - name: QA content checks (blocking)
        run: |
          cd scripts
          python qa_checks.py

      - name: Commit refreshed data
        id: commit
        run: |
          # v39 — commit as the owner's GitHub email. Vercel's Git integration only
          # deploys commits whose email maps to a GitHub account; the old
          # bot@foodshield.ai address didn't, so it blocked every refresh deploy.
          git config user.name  "foodshield-bot"
          git config user.email "fedde.vreeken@gmail.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes today."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            # v20.7: handle race condition where origin/main moved during the refresh run.
            # Rebase-and-push-with-retry. v39: on a rebase conflict (data/*.json vs new
            # remote work) we now AUTO-RESOLVE in favour of this fresh run (-X theirs)
            # instead of aborting the whole workflow — a daily refresh failing because two
            # data commits touched the same JSON shouldn't take the site offline.
            pushed=false
            for attempt in 1 2 3; do
              echo "Push attempt $attempt/3"
              if ! git pull --rebase -X theirs --autostash origin main; then
                echo "Rebase hit an unresolved conflict — aborting this attempt"
                git rebase --abort 2>/dev/null || true
                sleep 10
                continue
              fi
              if git push origin main; then
                echo "Push succeeded on attempt $attempt"
                pushed=true
                break
              fi
              echo "Push race detected — retrying after 10s"
              sleep 10
            done
            echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
            if [ "$pushed" != "true" ]; then
              echo "::warning::All 3 push attempts failed — data committed locally but not pushed this run; next run will retry."
            fi
          fi

      # v39 — Trigger the Vercel deploy explicitly via a Deploy Hook.
      # WHY: after the repo went private, Vercel's Git integration refuses to deploy
      # commits authored by the bot ("foodshield-bot is not a team member"), so the
      # live site stopped updating on the 6-hourly refresh. A Deploy Hook deploys on
      # ANY trigger regardless of git-author identity and needs no Pro plan. Create the
      # hook in Vercel (Project → Settings → Git → Deploy Hooks), then store the URL as
      # the repo secret VERCEL_DEPLOY_HOOK. If the secret is absent this step is skipped.
      - name: Trigger Vercel deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set — skipping deploy trigger. Add it in repo Settings → Secrets."
            exit 0
          fi
          echo "Triggering Vercel deploy hook…"
          curl -fsS -X POST "$HOOK" && echo "Deploy triggered." || echo "::warning::Deploy hook call failed."
